[package]
name = "models"
version = "0.1.0"
edition = "2024"

[lib]
name = "models"
path = "src/lib.rs"

[dependencies]
bytesize = { version = "2.0.1", features = ["serde"] }
chrono = "0.4.19"
db= { path = "../db" }
serde_json = "1.0.114"
serde = { version = "1.0.197", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.21"
harsh = "0.2"
