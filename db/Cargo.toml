[package]
name = "db"
version = "0.1.0"
edition = "2024"

[lib]
name = "db"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
r2d2_sqlite= "0.31.0"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
r2d2 = "0.8"


[dev-dependencies]
rand = "0.9.2"
random-string="1.1.0"